name: Test, Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE: maksim1995/barber_bot

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: "123456789:TEST_TOKEN_FOR_CI"
      ADMIN_IDS: "123456789"
      DATABASE_URL: "sqlite+aiosqlite:///data/test_database.db"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-and-push:
    name: Build and push Docker image
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "${IMAGE}:latest" .

      - name: Push Docker image
        run: docker push "${IMAGE}:latest"

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            mkdir -p \
              "$HOME/barber_bot/data" \
              "$HOME/barber_bot/logs"

            test -f "$HOME/barber_bot/.env"

            docker pull maksim1995/barber_bot:latest

            docker stop barber_bot || true
            docker rm barber_bot || true

            docker run -d \
              --name barber_bot \
              --restart unless-stopped \
              --stop-timeout 30 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --env-file "$HOME/barber_bot/.env" \
              -v "$HOME/barber_bot/data:/app/data" \
              -v "$HOME/barber_bot/logs:/app/logs" \
              maksim1995/barber_bot:latest

            sleep 5

            docker inspect \
              --format '{{.State.Running}}' \
              barber_bot | grep -qx true

            docker logs --tail=20 barber_bot